# =============================================================================
# AXIS: PowerSync Sync Rules (Multi-User Isolated)
# Matches the Postgres schema and client PowerSync SQLite database.
#
# Key rules:
#   • Every table is filtered by: WHERE user_id = bucket.user_id
#   • Each authenticated user syncs only their own data
#   • Matches exactly the 8 synced tables in public schema & powersync publication
# =============================================================================

bucket_definitions:
  user_data:
    parameters: SELECT request.user_id() AS user_id

    data:
      # ── Tasks ─────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          title, notes, status, priority, project_id, tags,
          due_date, due_time, estimate_min,
          recurrence_rule, recurrence_mode, completed_at
        FROM tasks
        WHERE user_id = bucket.user_id

      # ── Projects ──────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          name, color
        FROM projects
        WHERE user_id = bucket.user_id

      # ── Tags ──────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          name, color
        FROM tags
        WHERE user_id = bucket.user_id

      # ── Habits ────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          name, icon, color, kind, target_value, unit,
          schedule_type, remind_time, sort_order
        FROM habits
        WHERE user_id = bucket.user_id

      # ── Habit Logs ────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          habit_id, log_date, status, value, note
        FROM habit_logs
        WHERE user_id = bucket.user_id

      # ── Notes ─────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          title, body_md, pinned, category, mood, energy
        FROM notes
        WHERE user_id = bucket.user_id

      # ── Focus Sessions ────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          task_id, kind, planned_min, actual_min,
          started_at, ended_at, completed, xp_earned
        FROM focus_sessions
        WHERE user_id = bucket.user_id

      # ── Activity & XP Logs ────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          task_id, event_type, xp_earned, timestamp
        FROM logs
        WHERE user_id = bucket.user_id

      # ── Habit Categories ──────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at,
          name, icon, color, sort_order
        FROM habit_categories
        WHERE user_id = bucket.user_id

      # ── Prayers ───────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at,
          prayer_code, name, icon, time, sort_order, is_done
        FROM prayers
        WHERE user_id = bucket.user_id

      # ── User Profiles (Unique User XP & Level) ────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at,
          name, title, avatar_color, total_xp, level
        FROM user_profiles
        WHERE user_id = bucket.user_id



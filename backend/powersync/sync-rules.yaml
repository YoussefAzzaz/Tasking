# =============================================================================
# AXIS: PowerSync Sync Streams (Multi-User Isolated)
# Migrated from bucket_definitions to Sync Streams (edition: 3).
#
# Key rules:
#   • Every table is filtered by: WHERE user_id = auth.user_id()
#   • Each authenticated user syncs only their own data
#   • auto_subscribe: true ensures clients always receive all their data on connect
#   • Matches exactly the synced tables in public schema & powersync publication
# =============================================================================

config:
  edition: 3

streams:
  # ── All user-scoped data in one auto-subscribed stream ────────────────────
  user_data:
    auto_subscribe: true
    queries:

      # ── Tasks ───────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          title, notes, status, priority, project_id, tags,
          due_date, due_time, estimate_min,
          recurrence_rule, recurrence_mode, completed_at
        FROM tasks
        WHERE user_id = auth.user_id()

      # ── Projects ────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          name, color
        FROM projects
        WHERE user_id = auth.user_id()

      # ── Tags ────────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          name, color
        FROM tags
        WHERE user_id = auth.user_id()

      # ── Habits ──────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          name, icon, color, kind, target_value, unit,
          schedule_type, remind_time, sort_order, is_enabled
        FROM habits
        WHERE user_id = auth.user_id()

      # ── Habit Logs ──────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          habit_id, log_date, status, value, note
        FROM habit_logs
        WHERE user_id = auth.user_id()

      # ── Notes ───────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          title, body_md, pinned, category, mood, energy
        FROM notes
        WHERE user_id = auth.user_id()

      # ── Focus Sessions ──────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          task_id, kind, planned_min, actual_min,
          started_at, ended_at, completed, xp_earned
        FROM focus_sessions
        WHERE user_id = auth.user_id()

      # ── Activity & XP Logs ──────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at, deleted_at,
          task_id, event_type, xp_earned, timestamp
        FROM logs
        WHERE user_id = auth.user_id()

      # ── Habit Categories ────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at,
          name, icon, color, sort_order
        FROM habit_categories
        WHERE user_id = auth.user_id()

      # ── Note Categories ─────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at,
          name, icon, color, sort_order
        FROM note_categories
        WHERE user_id = auth.user_id()

      # ── Prayers ─────────────────────────────────────────────────────────────
      - SELECT
          id, user_id, created_at, updated_at,
          prayer_code, name, icon, time, sort_order, is_done
        FROM prayers
        WHERE user_id = auth.user_id()

      # ── User Profiles (Own Profile & Active Companions/Share Partners) ───────
      - SELECT
          id, user_id, created_at, updated_at,
          name, title, avatar_color, avatar_url, total_xp, level, friend_code
        FROM user_profiles
        WHERE user_id = auth.user_id()
           OR user_id IN (
             SELECT addressee_id FROM friendships WHERE requester_id = auth.user_id()
           )
           OR user_id IN (
             SELECT requester_id FROM friendships WHERE addressee_id = auth.user_id()
           )
           OR user_id IN (
             SELECT sender_id FROM companion_shares WHERE recipient_id = auth.user_id()
           )
           OR user_id IN (
             SELECT recipient_id FROM companion_shares WHERE sender_id = auth.user_id()
           )

      # ── Friendships (Mutual Connections) ───────────────────────────────────
      - SELECT
          id, requester_id, addressee_id, status, created_at, updated_at
        FROM friendships
        WHERE requester_id = auth.user_id() OR addressee_id = auth.user_id()

      # ── Daily Prayer & Habit Accountability ────────────────────────────────
      - SELECT
          id, user_id, date, fajr, dhuhr, asr, maghrib, isha,
          streak_days, habits_done, habits_total, created_at, updated_at
        FROM daily_prayer_status
        WHERE user_id = auth.user_id()
           OR user_id IN (
             SELECT addressee_id FROM friendships
             WHERE requester_id = auth.user_id() AND status = 'accepted'
           )
           OR user_id IN (
             SELECT requester_id FROM friendships
             WHERE addressee_id = auth.user_id() AND status = 'accepted'
           )

      # ── Friend Activity Logs ────────────────────────────────────────────────
      - SELECT
          id, user_id, event_type, title, metadata, created_at
        FROM friend_activity_logs
        WHERE user_id = auth.user_id()

      # ── Companion Shares (Tasks, Habits, Notes, Projects) ─────────────────
      - SELECT
          id, sender_id, recipient_id, entity_type, entity_id,
          share_mode, status, preview_data, accepted_entity_id,
          created_at, updated_at
        FROM companion_shares
        WHERE sender_id = auth.user_id() OR recipient_id = auth.user_id()

name: axis
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  uuid: ^4.6.0
  supabase_flutter: ^2.18.1
  powersync: ^2.4.0
  sqlite_async: ^0.14.6
  sqlite3: ^3.5.0
  go_router: ^18.0.2
  rrule: ^0.2.18
  google_fonts: ^8.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.2
  audioplayers: ^6.8.1
  awesome_notifications: ^0.12.1
  home_widget: ^0.10.0
  flutter_native_splash: ^2.4.8
  adhan_dart: ^2.0.1
  geolocator: ^14.1.2
  flutter_compass: ^0.8.1
  device_preview: ^1.2.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  file_picker: ^13.1.0
  crypto: ^3.0.3
  window_manager: ^0.5.2
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/transparent_splash.png

flutter_native_splash:
  color: "#080C14"
  color_dark: "#080C14"
  image: assets/transparent_splash.png
  android_12:
    color: "#080C14"
    color_dark: "#080C14"
    image: assets/transparent_splash.png
  android: true
  ios: true
  web: false

hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

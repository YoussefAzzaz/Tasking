name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.2.1)'
        required: true
        default: 'v1.2.1'
      changelog:
        description: 'Release notes / changelog'
        required: false
        default: 'Automated release update'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Linux Bundle
        working-directory: mobile
        run: flutter build linux --release

      - name: Package Linux tarball
        run: |
          tar -czf axis-linux-x64.tar.gz -C mobile/build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-linux-tarball
          path: axis-linux-x64.tar.gz

  publish-release:
    name: Publish Release to GitHub
    needs: [build-android, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: axis-android-apk
          path: artifacts/

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: axis-linux-tarball
          path: artifacts/

      - name: Prepare assets
        id: prepare
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          CLEAN_VER="${TAG#v}"
          mv artifacts/app-release.apk "artifacts/axis-v${CLEAN_VER}-android.apk"
          mv artifacts/axis-linux-x64.tar.gz "artifacts/axis-v${CLEAN_VER}-linux-x64.tar.gz"
          
          cd artifacts && sha256sum axis-v* > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Axis ${{ steps.prepare.outputs.tag }}
          body: ${{ inputs.changelog || 'Automated over-the-air update release for Axis.' }}
          files: |
            artifacts/axis-v*-android.apk
            artifacts/axis-v*-linux-x64.tar.gz
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

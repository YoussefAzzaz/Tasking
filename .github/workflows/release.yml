name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.3.3)'
        required: true
        default: 'v1.3.3'
      changelog:
        description: 'Release notes / changelog'
        required: false
        default: 'Automated release update'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle & Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-android-gradle-pub-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-pub-

      - name: Restore release keystore and environment
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ENV_CONTENT: ${{ secrets.RELEASE_ENV }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p mobile/android/app
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/axis-release.jks
          fi
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s\n' "$ENV_CONTENT" > mobile/.env
          fi

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        env:
          GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: axis-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Restore environment
        env:
          ENV_CONTENT: ${{ secrets.RELEASE_ENV }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s\n' "$ENV_CONTENT" > mobile/.env
          fi

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Linux Bundle
        working-directory: mobile
        run: flutter build linux --release --dart-define-from-file=.env

      - name: Package Linux tarball
        run: |
          tar -czf axis-linux-x64.tar.gz -C mobile/build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: axis-linux-tarball
          path: axis-linux-x64.tar.gz

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Restore environment
        env:
          ENV_CONTENT: ${{ secrets.RELEASE_ENV }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:ENV_CONTENT)) {
            $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
            [System.IO.File]::WriteAllText("$PWD\mobile\.env", $env:ENV_CONTENT, $utf8NoBom)
          }

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows Desktop
        working-directory: mobile
        run: flutter build windows --release --dart-define-from-file=.env

      - name: Package Windows ZIP
        run: Compress-Archive -Path "mobile\build\windows\x64\runner\Release\*" -DestinationPath "axis-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: axis-windows-zip
          path: axis-windows-x64.zip

  publish-release:
    name: Publish Release to GitHub
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: axis-android-apk
          path: artifacts/

      - name: Download Linux tarball
        uses: actions/download-artifact@v8
        with:
          name: axis-linux-tarball
          path: artifacts/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v8
        with:
          name: axis-windows-zip
          path: artifacts/

      - name: Prepare assets
        id: prepare
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          CLEAN_VER="${TAG#v}"
          mv artifacts/app-release.apk "artifacts/axis-v${CLEAN_VER}-android.apk"
          mv artifacts/axis-linux-x64.tar.gz "artifacts/axis-v${CLEAN_VER}-linux-x64.tar.gz"
          mv artifacts/axis-windows-x64.zip "artifacts/axis-v${CLEAN_VER}-windows-x64.zip"

          cd artifacts && sha256sum axis-v* > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Axis ${{ steps.prepare.outputs.tag }}
          body: ${{ inputs.changelog || 'Automated over-the-air update release for Axis.' }}
          files: |
            artifacts/axis-v*-android.apk
            artifacts/axis-v*-linux-x64.tar.gz
            artifacts/axis-v*-windows-x64.zip
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
